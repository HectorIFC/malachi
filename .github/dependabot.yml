version: 2
updates:
  # Elixir / Hex dependencies
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Every dependency PR lands on the maintainer, so an update cannot sit unowned: these arrive on a
    # schedule rather than from a person, which is exactly how a PR ends up with nobody looking at it.
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "dependencies"
    assignees:
      - "HectorIFC"
    commit-message:
      prefix: "chore(ci):"
