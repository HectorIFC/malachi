name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_USERNAME: hectorcardoso
  IMAGE_NAME: malachi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Get version from mix.exs
        id: version
        run: |
          VERSION=$(grep '@version' mix.exs | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The Docker Hub page has no overview at all, so the image's own storefront says nothing about
      # what it is or how to start it. This publishes one alongside every push of the image, which is
      # the only way the two stay in step: a description updated by hand drifts from the image it
      # describes, and nobody notices because nobody who works on the repo reads that page.
      #
      # A dedicated file rather than README.md, and not by preference: Docker Hub caps the description
      # at 25,000 characters and the README is over 42,000, so publishing it would mean truncating it
      # mid-section. The page it does publish is written for someone arriving at the image with no
      # context, which is a different reader from the one the README addresses.
      #
      # Only on a real push. A pull request does not push the image either (see `push:` above), so
      # updating the description from one would advertise a build that does not exist.
      #
      # Its own credential, and not for tidiness. This endpoint needs a token scoped
      # `read/write/delete`, which the token that pushes the image is not: reusing it here answered
      # `Forbidden` and failed the job on a run whose image had already published fine. Keeping the
      # push token narrow and confining the wider scope to this one call, made once per push to main,
      # is the trade worth making. Skipped with a note when the secret is absent, so a fork or a
      # checkout without it does not fail a build over a description.
      # Lifted into `env` because the `secrets` context is not available to a step's `if`, only to its
      # `with`, `env` and `run`. Testing it here is what lets the step below skip cleanly instead of
      # authenticating with an empty password and reading the 401 as a credentials problem.
      - name: Check for the description credential
        id: overview_cred
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_DESCRIPTION_TOKEN is not set; leaving the Docker Hub overview as published"
          fi

      - name: Publish the Docker Hub overview
        id: overview
        if: steps.overview_cred.outputs.present == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./docs/DOCKERHUB.md
          # Docker Hub caps this at 100 characters, and a colon followed by a space would end the YAML
          # scalar early, so it is neither long nor punctuated the way prose would be.
          short-description: An Elixir log broker on the NorthGuard model, quorum-replicated, cursors not offsets

      # `continue-on-error` above keeps a stale overview from failing a build whose image published
      # correctly, and the cost of that is a failure nobody reads. This says it out loud, in the job
      # summary rather than only in a collapsed step, so the two outcomes stay distinguishable: the
      # image is out either way, the page describing it may not be.
      - name: Say so if the overview did not update
        if: steps.overview.outcome == 'failure'
        run: |
          {
            echo "### Docker Hub overview not updated"
            echo
            echo "The image published. The description PATCH failed, most often because"
            echo "DOCKERHUB_DESCRIPTION_TOKEN lacks the read/write/delete scope the endpoint requires."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "overview update failed; see the job summary"
