name: OpenSSF Scorecard

# Scores the repository against the OpenSSF Scorecard checks and publishes the result: a SARIF report in the
# Security tab, and a public score behind the README badge. The scorecard-action only publishes from the default
# branch, so there is no pull_request trigger: pull_request and workflow_dispatch are experimental for it.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 01:30 UTC. Kept off the 02:00 daily Security Audit so the two do not compete for runners.
    - cron: '30 1 * * 1'

# Read-only by default for the whole workflow; the one job that publishes grants what it needs below.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # id-token: write is required to publish results (the badge is served from them), and only this job may hold it.
    # scorecard-action restricts the job: its steps may use only checkout, upload-artifact, upload-sarif,
    # scorecard-action and harden-runner. Adding any other action here will make the publish step refuse to run.
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔍 Run the Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 📤 Upload the SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: 🛡️ Upload to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
