name: Performance Benchmarks

# Runs on every branch, no exceptions: push and pull_request without a branch filter, plus manual dispatch.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prealloc_ab:
        description: 'Also run the paired preallocation experiment (issue #83). Minutes, not seconds.'
        type: boolean
        default: false
      prealloc_ab_stage:
        description: 'Stage 1 triages every mechanism; 2 confirms one against the baseline; 3 sweeps flush sizes for the crossover.'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      prealloc_ab_reps:
        description: 'Interleaved repetitions per arm'
        type: string
        default: '15'
      prealloc_ab_mechanism:
        description: 'Stages 2 and 3: which mechanism to measure'
        type: choice
        options: ['zeros', 'allocate', 'sparse', 'grow']
        default: 'zeros'
      prealloc_ab_sync:
        description: 'Stages 2 and 3: which sync to measure it with'
        type: choice
        options: ['datasync', 'sync']
        default: 'datasync'
      blank_tail_scan:
        description: 'Measure what proving a preallocated tail is unwritten costs (issue #149). Seconds, not minutes.'
        type: boolean
        default: false
      store_error_path_ab:
        description: 'Paired A/B of the storage error path against main (issue #147). Tens of minutes.'
        type: boolean
        default: false
      store_error_path_ab_reps:
        description: 'Store-case repetitions per arm (a verdict needs at least 5)'
        type: string
        default: '15'
      store_error_path_ab_e2e_reps:
        description: 'End-to-end (throughput_1m) repetitions per arm, about 16s each (a verdict needs at least 5; 0 skips the case)'
        type: string
        default: '5'
      docker_cluster_durability:
        description: 'Run the Docker cluster benchmark on tmpfs and on a real disk, interleaved (issue #144). About half an hour.'
        type: boolean
        default: false
      docker_cluster_reps:
        description: 'Repetitions of each data mode (the spread between them is the noise floor)'
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run performance benchmarks
    runs-on: ubuntu-latest

    # ex_doc-free dev build: the benchmark is a plain `mix run` script against the project's deps.
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # No later step does authenticated git, and this job then runs repo code (deps + the benchmark),
        # so do not leave the GitHub token in the local git config.
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-bench-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-bench-

      - name: Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      # storage_viability measures the local pure-Elixir file I/O hot path against NorthGuard's storage
      # targets. It writes under /tmp and cleans up after itself, so it needs no running server. Use
      # --no-start so Malachi.Application (prod config validation + the supervision tree) is not booted;
      # the script only needs :crypto (loaded on demand) and file I/O.
      - name: Run storage viability benchmark
        run: mix run --no-start benchmark/storage_viability.exs

      # The measurement behind issue #83, opt-in because it takes minutes and every push runs this job.
      # It needs a real filesystem to mean anything: fsync and fdatasync cost the same on tmpfs, and on
      # macOS neither reaches stable media. The runner's /tmp is ext4 on a real disk, which is the
      # platform the decision is actually about.
      #
      # It also has to run SERIALLY, in one process, on one filesystem. Arms measured in parallel would
      # contend for the same disk queue and journal, and arms split across runners would be compared
      # across machines, which is precisely the bias the A-A control exists to expose.
      - name: Run the preallocation A/B experiment
        if: ${{ inputs.prealloc_ab }}
        env:
          PREALLOC_AB: '1'
          PREALLOC_AB_STAGE: ${{ inputs.prealloc_ab_stage }}
          PREALLOC_AB_REPS: ${{ inputs.prealloc_ab_reps }}
          PREALLOC_AB_MECHANISM: ${{ inputs.prealloc_ab_mechanism }}
          PREALLOC_AB_SYNC: ${{ inputs.prealloc_ab_sync }}
          PREALLOC_AB_OUT: ${{ runner.temp }}/prealloc-ab.json
        run: mix run --no-start benchmark/storage_viability.exs

      - name: Upload the A/B measurement
        if: ${{ inputs.prealloc_ab }}
        uses: actions/upload-artifact@v7
        with:
          name: prealloc-ab-measurement-stage-${{ inputs.prealloc_ab_stage }}
          path: ${{ runner.temp }}/prealloc-ab.json
          if-no-files-found: error

      # The measurement behind issue #149. The 1MB probe bound was chosen against 344ms measured for
      # 64MB on macOS, and the target is Linux, where a recovery reads a file written moments earlier
      # that is likely page-cache warm. If the real number here is tens of milliseconds, the bound is
      # not worth its exposure and the tail should simply be verified whole.
      - name: Measure the blank tail verification cost
        if: ${{ inputs.blank_tail_scan }}
        env:
          BLANK_SCAN_OUT: ${{ runner.temp }}/blank-tail-scan.json
        run: mix run --no-start benchmark/blank_tail_scan.exs

      - name: Upload the blank tail measurement
        if: ${{ inputs.blank_tail_scan }}
        uses: actions/upload-artifact@v7
        with:
          name: blank-tail-scan
          path: ${{ runner.temp }}/blank-tail-scan.json
          if-no-files-found: error

      # The measurement behind issue #147: does handing storage errors back cost the produce hot path
      # anything? It compares this checkout against main, so main is checked out beside it, outside the
      # workspace, and both are built from their own sources. The runner's temp dir is ext4 on a real disk,
      # the platform the answer is about; the script refuses to call a run too short to judge a pass.
      - name: Check out main as the A/B baseline
        if: ${{ inputs.store_error_path_ab }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: store-error-path-baseline
          persist-credentials: false

      - name: Run the storage error path A/B
        if: ${{ inputs.store_error_path_ab }}
        env:
          AB_REPS: ${{ inputs.store_error_path_ab_reps }}
          AB_E2E_REPS: ${{ inputs.store_error_path_ab_e2e_reps }}
          AB_DIR: ${{ runner.temp }}/store_error_path_ab
        run: |
          mv store-error-path-baseline "$RUNNER_TEMP/baseline"
          benchmark/store_error_path_ab.sh "$RUNNER_TEMP/baseline" . "$RUNNER_TEMP/store-error-path-ab"

      - name: Upload the storage error path A/B
        if: ${{ always() && inputs.store_error_path_ab }}
        uses: actions/upload-artifact@v7
        with:
          name: store-error-path-ab
          path: ${{ runner.temp }}/store-error-path-ab/report.json
          if-no-files-found: error

  # The measurement behind issue #144: the cluster produce path with its data on tmpfs, where fsync is
  # free, against the same cluster on a real disk with production preallocation, where the durable path
  # is paid in full. Opt-in and dispatch-only because it takes about half an hour, and its own job so it
  # runs on a runner nothing else is using. Only this Linux run counts; see benchmark/README.md for the
  # protocol (interleaved repetitions in rotating order, a difference claimed only for disjoint ranges).
  docker-cluster-durability:
    name: Docker cluster, tmpfs against real disk
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_cluster_durability }}
    runs-on: ubuntu-latest
    # About 12 cases of two minutes plus the image build. Twice that is stuck, not slow.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # This job runs repository code (the images and the harness) and does no authenticated git.
        with:
          persist-credentials: false

      # At RF=3 the disk mode preallocates 64MB for every topic on every replica, about 12GB with the
      # default 64 topics, and the runner's free space is not much more than that. The harness refuses a
      # case that does not fit; this makes room for it by removing toolchains nothing here uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      # The harness defaults assume a workstation with eight cores; a GitHub runner has four, so the
      # cpusets are re-split here, as the chaos job does. Both modes run in every repetition, so a slow
      # stretch of the runner lands on both instead of reading as the effect of one, and which mode goes
      # first rotates by repetition (tmpfs first, then disk first, ...): with a fixed order any position
      # effect lands on the second mode every time, which is how #82's arms came out biased.
      - name: Run both data modes, interleaved
        env:
          DOCKER_CLUSTER_REPS: ${{ inputs.docker_cluster_reps }}
          SRV_CPUSET: '1,2,3'
          LT_CPUSET: '0'
          OUT: ${{ runner.temp }}/docker-cluster/cases.jsonl
        run: |
          set -uo pipefail
          case "$DOCKER_CLUSTER_REPS" in
            '' | *[!0-9]* | 0*) echo "docker_cluster_reps must be a positive integer, got '$DOCKER_CLUSTER_REPS'"; exit 2 ;;
          esac
          failed=0
          for rep in $(seq 1 "$DOCKER_CLUSTER_REPS"); do
            if [ $((rep % 2)) = 1 ]; then modes="0 1"; else modes="1 0"; fi
            for mode in $modes; do
              echo "::group::repetition $rep, REAL_DISK=$mode"
              REAL_DISK="$mode" benchmark/docker-cluster.sh || { echo "::error::repetition $rep with REAL_DISK=$mode failed"; failed=1; }
              echo "::endgroup::"
            done
          done
          exit "$failed"

      # always(): a run with failed cases still recorded the ones that finished, and the summary lists
      # the failures by name.
      - name: Summarize
        if: always()
        run: |
          cases="$RUNNER_TEMP/docker-cluster/cases.jsonl"
          if [ -s "$cases" ]; then
            jq -rs -f benchmark/docker-cluster-summary.jq "$cases" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No case was recorded." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-cluster-durability
          path: ${{ runner.temp }}/docker-cluster/cases.jsonl
          if-no-files-found: warn
