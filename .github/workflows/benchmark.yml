name: Performance Benchmarks

# Runs on every branch, no exceptions: push and pull_request without a branch filter, plus manual dispatch.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sync_ab:
        description: 'Also run the paired fsync-vs-fdatasync experiment (issue #82). Minutes, not seconds.'
        type: boolean
        default: false
      sync_ab_reps:
        description: 'Interleaved repetitions per arm'
        type: string
        default: '15'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run performance benchmarks
    runs-on: ubuntu-latest

    # ex_doc-free dev build: the benchmark is a plain `mix run` script against the project's deps.
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # No later step does authenticated git, and this job then runs repo code (deps + the benchmark),
        # so do not leave the GitHub token in the local git config.
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-bench-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-bench-

      - name: Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      # storage_viability measures the local pure-Elixir file I/O hot path against NorthGuard's storage
      # targets. It writes under /tmp and cleans up after itself, so it needs no running server. Use
      # --no-start so Malachi.Application (prod config validation + the supervision tree) is not booted;
      # the script only needs :crypto (loaded on demand) and file I/O.
      - name: Run storage viability benchmark
        run: mix run --no-start benchmark/storage_viability.exs

      # The measurement behind issue #82, opt-in because it takes minutes and every push runs this
      # job. It needs a real filesystem to mean anything: fsync and fdatasync cost the same on tmpfs,
      # and on macOS neither reaches stable media. The runner's /tmp is ext4 on a real disk, which is
      # the platform the decision is actually about.
      - name: Run the fsync vs fdatasync A/B experiment
        if: ${{ inputs.sync_ab }}
        env:
          SYNC_AB: '1'
          SYNC_AB_REPS: ${{ inputs.sync_ab_reps }}
          SYNC_AB_OUT: ${{ runner.temp }}/sync-ab.json
        run: mix run --no-start benchmark/storage_viability.exs

      - name: Upload the A/B measurement
        if: ${{ inputs.sync_ab }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-ab-measurement
          path: ${{ runner.temp }}/sync-ab.json
          if-no-files-found: error
