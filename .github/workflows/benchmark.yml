name: Performance Benchmarks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      - name: Install dependencies (no cache - compile from scratch)
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile
          mix compile

      - name: Run benchmark suite
        run: |
          chmod +x benchmark/run_all_baselines.sh
          bash benchmark/run_all_baselines.sh
        env:
          MIX_ENV: dev
          MALACHI_LOGGER_LEVEL: warning
          MALACHI_RATE_LIMIT_ENABLED: 'false'
          MALACHI_CONNECTION_LIMIT_ENABLED: 'false'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/baseline_*.json
          retention-days: 30

      - name: Compare against baseline
        id: compare
        if: hashFiles('benchmark/results/baseline_reference.json') != ''
        continue-on-error: true
        run: |
          LATEST_RESULT=$(ls -t benchmark/results/baseline_*.json | head -1)

          # Run comparison using mix run so Jason dependency is available
          mix run benchmark/compare_baselines.exs -- benchmark/results/baseline_reference.json "$LATEST_RESULT" 2>&1 | tee comparison_output.txt
          COMPARE_EXIT=${PIPESTATUS[0]}

          if [ $COMPARE_EXIT -ne 0 ]; then
            echo "REGRESSION_DETECTED=true" >> $GITHUB_OUTPUT
          else
            echo "REGRESSION_DETECTED=false" >> $GITHUB_OUTPUT
          fi
        env:
          MIX_ENV: dev

      - name: Generate PR comment
        if: github.event_name == 'pull_request' && hashFiles('benchmark/results/baseline_reference.json') != ''
        run: |
          LATEST_RESULT=$(ls -t benchmark/results/baseline_*.json | head -1)

          # Generate GitHub markdown comparison report using mix run for Jason access
          mix run -e '
            Code.require_file("benchmark/utils/comparator.ex")

            baseline_data = Jason.decode!(File.read!("benchmark/results/baseline_reference.json"))
            current_data = Jason.decode!(File.read!(System.argv() |> List.first()))

            comparison = BenchmarkComparator.perform_comparison(baseline_data, current_data)
            markdown = BenchmarkComparator.format_github_comment(comparison)

            IO.puts(markdown)
          ' -- "$LATEST_RESULT" > pr_comment.md

          cat pr_comment.md
        env:
          MIX_ENV: dev

      - name: Post PR comment
        if: github.event_name == 'pull_request' && hashFiles('benchmark/results/baseline_reference.json') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('pr_comment.md', 'utf8');

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Performance Comparison Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Fail if regressions detected
        if: steps.compare.outputs.REGRESSION_DETECTED == 'true'
        run: |
          echo "::error::Performance regressions detected! Check the comparison output above."
          exit 1

      - name: No baseline warning
        if: hashFiles('benchmark/results/baseline_reference.json') == ''
        run: |
          echo "::warning::No baseline reference found at benchmark/results/baseline_reference.json"
          echo "::warning::Run ./benchmark/run_all_baselines.sh and copy the consolidated result as baseline_reference.json"
          echo "Benchmark results were collected but not compared against a baseline."
