name: Performance Benchmarks

# Runs on every branch, no exceptions: push and pull_request without a branch filter, plus manual dispatch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run performance benchmarks
    runs-on: ubuntu-latest

    # ex_doc-free dev build: the benchmark is a plain `mix run` script against the project's deps.
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # No later step does authenticated git, and this job then runs repo code (deps + the benchmark),
        # so do not leave the GitHub token in the local git config.
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-bench-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-bench-

      - name: Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          exit 1

      # storage_viability measures the local pure-Elixir file I/O hot path against NorthGuard's storage
      # targets. It writes under /tmp and cleans up after itself, so it needs no running server. Use
      # --no-start so Malachi.Application (prod config validation + the supervision tree) is not booted;
      # the script only needs :crypto (loaded on demand) and file I/O.
      - name: Run storage viability benchmark
        run: mix run --no-start benchmark/storage_viability.exs
