name: Publish results

# Keeps every published benchmark and chaos number current without anyone remembering to refresh it.
# Everything the site shows comes from benchmark/published/*.json: the generated pages under
# docs/generated, and the standalone dashboard at /benchmarks/, which reads the same three files. They
# were once written by hand, which is how the site came to advertise 0.7.8 numbers while the project
# shipped 0.8.1, and the dashboard kept a fourth copy of its own that drifted the same way.
#
# The split between the two triggers is the whole design. A pull request RUNS the workloads and
# commits nothing: runner-to-runner variance would otherwise put a few thousand records per second of
# noise into every diff. It also reports them in a comment, but only from a branch in this repository:
# GITHUB_TOKEN is read-only on a pull request from a fork, so that step is skipped there rather than
# failing, and a fork's numbers reach its author through the uploaded artifacts instead. A push to
# main runs them again and commits the result,
# so what the site publishes is always what the merged code measured on a CI runner rather than on
# whichever laptop last felt like capturing a sample.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loadtest:
    name: Load test (${{ matrix.generator }})
    runs-on: ubuntu-latest

    # Two generators, two runners. Each leg boots its OWN server on its OWN runner, so one load test can
    # never influence the other (no shared server, no shared CPU, no ordering between them). fail-fast is
    # off so one generator failing still lets the other's number through, the same as a missing artifact.
    strategy:
      fail-fast: false
      matrix:
        generator: [node, elixir]

    env:
      MIX_ENV: dev
      # Dev-mode users; the generators authenticate with them. The Node client reads the environment,
      # the Elixir one takes flags, which is why the credentials appear in both forms below.
      MALACHI_USER: admin
      MALACHI_PASS: admin123
      # Admission limits gate connections and auth rather than the produce path, so leaving them on
      # would cap the measurement without protecting anything a load test needs protecting from.
      MALACHI_RATE_LIMIT_ENABLED: 'false'
      MALACHI_CONNECTION_LIMIT_ENABLED: 'false'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        # This job runs repository code (deps and the generators). Nothing here does authenticated
        # git, so the token has no business staying in the local git config.
        with:
          persist-credentials: false

      - name: 🔧 Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      # Only the node leg needs a Node runtime: it is the generator there. The elixir leg's harness uses
      # bash and jq alone, and Elixir is set up in both legs because the SERVER under test is an Elixir
      # application either way.
      - name: 🟢 Set up Node
        if: matrix.generator == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-results-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-results-

      - name: 🔨 Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse
          # on a cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && break
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
          done
          # Unpinned (all cores): only the measured run below is pinned to keep the comparison honest.
          mix compile

      # One generator against its own freshly booted server, server pinned to 3 cores and the generator
      # to 1, and a connections sweep whose peak is Malachi's ceiling. loadtest-ceiling.sh boots, samples
      # the server's CPU and tears down inside its own shell, so the whole run lives in one step and the
      # working tree stays clean (the recorded git ref names a real commit, not <sha>-dirty).
      - name: 📊 Run the ${{ matrix.generator }} ceiling load test
        env:
          GENERATOR: ${{ matrix.generator }}
          SRV_CPUSET: '1,2,3'
          LT_CPUSET: '0'
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          OUT="$RUNNER_TEMP/results/loadtest-$GENERATOR.json" \
            RUN_DIR="$RUNNER_TEMP/results/ladder-$GENERATOR" \
            scripts/loadtest-ceiling.sh
          jq -r '"peak: \(.records_per_s) rec/s @ \(.connections) conns, server \(.server_cpu_cores) of \(.server_cpu_budget) cores, generator \(.generator_cpu_cores) of \(.generator_cpu_budget), \(.errors) errors, ref \(.meta.git_ref)"' \
            "$RUNNER_TEMP/results/loadtest-$GENERATOR.json"

      # A per-generator artifact name: upload-artifact v4+ rejects two parallel jobs writing the same
      # name. The canonical loadtest-<gen>.json sits at the artifact root (the publish job copies it);
      # the swept ladder and logs ride along in a subdir for transparency, out of that copy's *.json glob.
      - name: 📤 Upload load test results
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-results-${{ matrix.generator }}
          path: ${{ runner.temp }}/results
          if-no-files-found: error

  chaos:
    name: Chaos certification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The cpusets exist so the load generator can never steal server CPU and flatter the numbers.
      # The harness defaults assume a workstation (six cores for the servers, two for the client); a
      # GitHub runner has four, so they are re-split here rather than left to fail with an unavailable
      # cpuset. The checker window is shortened for the same reason: less traffic through the faults
      # than a local run, still a full pass of all four of them.
      - name: 💥 Run the node-fault certification
        env:
          SRV_CPUSET: '1,2,3'
          LT_CPUSET: '0'
          CHECKER_WINDOW_S: '90'
          CHAOS_COMMAND: scripts/docker-chaos-test.sh
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          CHAOS_RESULT_FILE="$RUNNER_TEMP/results/chaos-node.json" scripts/docker-chaos-test.sh

      # if: always() because a FAILED certification is the run whose record matters most. The harness
      # writes its JSON before exiting non-zero, so the artifact exists either way and the comment
      # below can say what broke.
      - name: 📤 Upload chaos result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-results
          path: ${{ runner.temp }}/results/*.json
          if-no-files-found: warn

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [loadtest, chaos]
    # Not always(): a cancelled run has nothing to say, but a run whose chaos certification FAILED has
    # a great deal to say and must still reach the comment below.
    if: ${{ !cancelled() }}

    permissions:
      contents: write
      pull-requests: write

    # Reads the comment list and then writes based on what it read, so two runs of this job must not
    # interleave: both would find no marker and both would create one. Keyed per ref so unrelated pull
    # requests still run in parallel, and never cancel-in-progress, because a run that is already
    # pushing a commit should finish rather than leave the branch half updated.
    concurrency:
      group: publish-results-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: 📋 Collect what was measured
        id: collect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p benchmark/published

          # A workload that produced no artifact used to leave the last committed file in place, and
          # the pull request comment then reported that older measurement as this run's.
          #
          # Cleared on a pull request only, where nothing is committed and the worst case is a row
          # that reads "not recorded". On a push to main the commit step below would see the removal
          # as a deletion and drop a good published result over one failed run, trading a stale number
          # for no number at all. There the file stays, and every surface that renders it prints the
          # git ref it came from, so a reader can see it is not this commit's.
          if [ "$EVENT" = "pull_request" ]; then
            rm -f benchmark/published/*.json
          fi

          for f in "$RUNNER_TEMP"/artifacts/*.json; do
            [ -e "$f" ] || continue
            cp "$f" "benchmark/published/$(basename "$f")"
          done
          git status --porcelain -- benchmark/published

      # Skipped for a pull request opened from a fork. GITHUB_TOKEN is read-only there whatever this
      # workflow asks for in `permissions`, so the write below comes back 403 and fails the step: a
      # red run for a contributor who did nothing wrong, on a job whose numbers were measured fine and
      # are still uploaded as artifacts. Reaching for `pull_request_target` would grant the write and
      # is the wrong trade, since this job checks out and runs the pull request's own code.
      - name: 💬 Report on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'benchmark/published';

            const read = (file) => {
              try { return JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8')); }
              catch { return null; }
            };

            // Every field is read defensively, and not out of politeness. The try above catches a file
            // that is absent or unparseable, but a file that parses and is INCOMPLETE used to throw:
            // records_per_s undefined has no toLocaleString, and a chaos record written by a drill that
            // died before computing its invariants has no verdict to upper-case. The throw failed the
            // step, so the pull request got no comment at all, exactly on the runs that went wrong and
            // exactly when the numbers were most worth seeing.
            // The unit travels with the number and is dropped along with it, so a field that is absent
            // reads as absent rather than as "not recorded rec/s", which claims a measurement and
            // withholds it in the same breath.
            const measured = (value, unit, absent) =>
              typeof value === 'number' ? `${value.toLocaleString('en-US')} ${unit}` : absent;
            const list = (value) => (Array.isArray(value) ? value : []);

            // Throughput now carries the connection count it peaked at, since the number is a ceiling
            // found by sweeping connections rather than a fixed-concurrency sample.
            const throughput = (result) =>
              typeof result.records_per_s === 'number'
                ? `${result.records_per_s.toLocaleString('en-US')} rec/s @ ${result.connections ?? '?'} conns` +
                  (result.peak_at_ladder_limit ? ' (lower bound)' : '')
                : 'not recorded';

            // With the generator pinned to one core and the server to the rest, this says which side
            // saturated: a server near its budget means its ceiling was found, a generator near its
            // budget means the client capped first and the number is a lower bound. Each side renders
            // only when the run sampled it (absent on old runs and non-/proc hosts).
            const cpuSide = (label, cores, budget) =>
              typeof cores === 'number' && typeof budget === 'number' ? `${label} ${cores}/${budget}` : null;
            const cpu = (result) => {
              const sides = [
                cpuSide('srv', result.server_cpu_cores, result.server_cpu_budget),
                cpuSide('gen', result.generator_cpu_cores, result.generator_cpu_budget),
              ].filter(Boolean);
              return sides.length ? `${sides.join(', ')} cores` : 'n/a';
            };

            // A missing result is reported as missing rather than skipped: a workload that failed to
            // produce one is the thing a reader most needs to notice.
            const loadRow = (label, result) =>
              result
                ? `| ${label} | ${throughput(result)} | ${cpu(result)} | ${result.errors ?? '?'} | \`${result.meta?.git_ref ?? 'unknown'}\` |`
                : `| ${label} | not recorded | | | |`;

            const chaos = read('chaos-node.json');
            const failures = list(chaos?.failures);
            const chaosLine = chaos
              ? `**${(chaos.verdict ?? 'unknown').toUpperCase()}** at RF ${chaos.replication_factor ?? '?'}: ` +
                `${list(chaos.events).length} faults injected, ` +
                `${measured(chaos.invariants?.acked_writes, 'acknowledged writes verified', 'acknowledged writes not counted')}` +
                (failures.length ? `\n\nFailures:\n${failures.map((f) => `- ${f}`).join('\n')}` : '')
              : 'not recorded';

            const body = `## 📊 Measured on this branch

            | Load test | Throughput | CPU | Errors | Commit |
            |---|---|---|---|---|
            ${loadRow('Node.js', read('loadtest-node.json'))}
            ${loadRow('Elixir', read('loadtest-elixir.json'))}

            **Chaos certification**: ${chaosLine}

            Each generator ran on its own runner, server pinned to 3 cores and generator to 1, sweeping
            connections until throughput plateaued; the row shows that peak. In the CPU column, srv near
            3 means the server's ceiling was found; gen near 1 means the single generator core capped
            first and the throughput is a lower bound on the server's ceiling.

            These numbers are measured, not committed: a shared runner varies enough between runs that
            recording them here would put noise in every diff. The published pages are refreshed from
            the run on main after this merges.

            ---
            *This comment was automatically generated by the results workflow*
            `;

            const marker = 'automatically generated by the results workflow';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: body
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # Only on main, and only what actually changed. A push authenticated with GITHUB_TOKEN does not
      # start another workflow run, which is what keeps this from committing to itself forever; the
      # cost of that same rule is that it does not start the Pages build either, so pages.yml listens
      # for this workflow to finish instead.
      - name: 📌 Commit the refreshed results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- benchmark/published; then
            echo "results are unchanged; nothing to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add benchmark/published
          git commit -m "chore(results): refresh published benchmark and chaos results from CI"

          # Rebase before pushing, and try again if the push still loses. This job checks out the SHA
          # that triggered it, then spends several minutes running load tests and a chaos drill, so
          # anything pushed to main in the meantime leaves it behind: a bare push is rejected with
          # `fetch first`, which is exactly how it failed when a version bump landed during a run.
          # The concurrency group above serializes runs of THIS workflow and cannot serialize a human,
          # so it was never the protection this needed.
          #
          # Retried rather than rebased once, because the same race can happen again between the
          # rebase and the push. Bounded, because a push that keeps losing is a busy main rather than
          # a transient, and failing then is the honest outcome. The commit touches only
          # benchmark/published, so a rebase conflict means something else wrote the same results,
          # which is a case that should stop rather than resolve itself.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the current main"
            git pull --rebase origin main
          done

          echo "still could not push after 3 attempts"
          exit 1
