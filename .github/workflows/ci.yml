name: CI

# Only for an open pull request, draft or ready for review (the default pull_request types cover both), plus
# main after a merge, which keeps the cache pull requests restore and the Codecov base current. A branch with
# no pull request runs nothing: a push to it would have run every job twice once a pull request existed.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# Read-only token for every job: nothing here writes to the repository, and these jobs run the code under test.
permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19.4'
            otp: '28.1'
            lint: true
            coverage: true
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: 🔧 Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The load generator tests drive scripts/loadtest.js against the test server, so the suite needs
      # Node. Set up explicitly rather than trusting whatever the runner image happens to ship: those
      # tests fail rather than skip when node is missing. 22 because the payload checks compress with the
      # zstd in Node's zlib, which arrived in 22.15 (#192).
      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      
      - name: 🔨 Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      
      - name: 🔍 Check unused dependencies
        run: mix deps.unlock --check-unused
        if: matrix.lint
      
      - name: ⚙️ Compile (warnings as errors)
        run: mix compile --warnings-as-errors
        if: matrix.lint
      
      - name: ⚙️ Compile (dev)
        run: mix compile
        if: ${{ !matrix.lint }}
      
      - name: 🎨 Check formatting
        run: mix format --check-formatted
        if: matrix.lint

      # docs/design/design-tokens.json generates the web stylesheet, the terminal palette, the Elixir
      # module and the snapshot (#227). This fails on an output that was not regenerated and committed,
      # on a committed output that breaks the cross language contract, and on a raw color literal in
      # assets/src or tui/src. Its own step, so the message is the first thing in the log.
      - name: 🎨 Check design tokens
        run: mix malachi.tokens --check
        if: matrix.lint
      
      - name: 🔎 Run Credo (static analysis)
        run: mix credo --strict
        if: matrix.lint
        continue-on-error: true  # Don't fail build on credo warnings
      
      - name: 📊 Run tests with coverage
        run: mix coveralls.json
        if: matrix.coverage
      
      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.coverage
        with:
          files: ./cover/excoveralls.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # A fresh checkout has none of the gitignored material a developer's priv holds (dist_cert, cert,
      # plts), so without these decoys a Dockerfile that went back to copying priv as a whole would still
      # build an image whose priv holds only static, and the static assets check below would pass. They are
      # placeholders, not keys: the check fails if either reaches the image.
      - name: 🪤 Plant decoy development material under priv
        run: |
          mkdir -p priv/dist_cert priv/cert
          echo "decoy, must never reach the image" > priv/dist_cert/decoy.key
          echo "decoy, must never reach the image" > priv/cert/decoy.key

      - name: 🔨 Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: malachi:test
          build-args: |
            APP_VERSION=test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Test Docker image
        run: |
          # Cleanup function to ensure container removal
          cleanup_container() {
            echo "🛑 Cleaning up container..."
            docker stop malachi-test > /dev/null 2>&1 || true
            docker rm malachi-test > /dev/null 2>&1 || true
          }
          trap cleanup_container EXIT

          # Generate passwords using openssl for better entropy
          ADMIN_PASS="ci_admin_$(openssl rand -hex 8)"
          PRODUCER_PASS="ci_producer_$(openssl rand -hex 8)"
          CONSUMER_PASS="ci_consumer_$(openssl rand -hex 8)"
          APP_PASS="ci_app_$(openssl rand -hex 8)"

          echo "🚀 Starting container..."
          docker run -d --name malachi-test \
            -e MALACHI_CONFIG_ENV=test \
            -e MALACHI_TCP_PORT=4040 \
            -e MALACHI_DASHBOARD_PORT=4041 \
            -e MALACHI_DEFAULT_USERS="admin:${ADMIN_PASS}:admin;producer:${PRODUCER_PASS}:produce;consumer:${CONSUMER_PASS}:consume;app:${APP_PASS}:produce,consume" \
            -e MALACHI_REQUIRE_TLS=false \
            -p 4040:4040 \
            -p 4041:4041 \
            malachi:test

          # Wait for container to start (2 seconds)
          sleep 2

          # Check if container is running
          if ! docker ps | grep -q malachi-test; then
            echo "❌ Container failed to start!"
            echo ""
            echo "📋 Container logs:"
            docker logs malachi-test 2>&1 || echo "Could not retrieve logs"
            echo ""
            echo "🔍 Container diagnostic info:"
            docker inspect malachi-test --format='Exit Code: {{.State.ExitCode}}' 2>&1 || true
            docker inspect malachi-test --format='Started: {{.State.StartedAt}} | Ended: {{.State.FinishedAt}}' 2>&1 || true
            exit 1
          fi
          echo "✅ Container is running"

          # Wait for dashboard to be ready (max 15 seconds - app MUST be fast)
          echo "⏳ Waiting for dashboard to be ready (timeout: 15s)..."
          MAX_ATTEMPTS=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -sf http://localhost:4041/login > /dev/null 2>&1; then
              echo "✅ Dashboard is ready (${ATTEMPT}s)"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Dashboard failed to start within 15 seconds!"
              echo "This indicates a performance issue that needs investigation."
              echo "📋 Container logs:"
              docker logs malachi-test
              docker stop malachi-test
              exit 1
            fi
            sleep 1
          done

          # The image must ship priv/static and nothing else from priv (#226): without it every asset
          # answers 404, and a copy of priv as a whole would carry the decoys planted before the build.
          echo "🖼️ Checking static assets..."
          if ! scripts/docker-static-assets-check.sh malachi-test http://localhost:4041; then
            echo "📋 Container logs:"
            docker logs malachi-test
            exit 1
          fi

          # Check if the application process is running
          echo "🔍 Checking application process..."
          docker exec malachi-test cat /proc/1/cmdline | tr '\0' ' '

          # Authenticate and get token
          echo "🔐 Authenticating with dashboard..."
          LOGIN_RESPONSE=$(curl -sf -X POST http://localhost:4041/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASS\"}" 2>&1)

          if [ $? -ne 0 ]; then
            echo "❌ Authentication request failed!"
            echo "Response: $LOGIN_RESPONSE"
            docker logs malachi-test
            docker stop malachi-test
            exit 1
          fi

          # Extract token
          TOKEN=$(echo "$LOGIN_RESPONSE" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['token'])" 2>&1)

          if [ $? -ne 0 ]; then
            echo "❌ Failed to extract token!"
            echo "Login response: $LOGIN_RESPONSE"
            docker logs malachi-test
            docker stop malachi-test
            exit 1
          fi

          echo "✅ Authentication successful"

          # Check metrics endpoint
          echo "📊 Fetching metrics..."
          METRICS_RESPONSE=$(curl -sf http://localhost:4041/metrics \
            -H "Authorization: Bearer $TOKEN" 2>&1)

          if [ $? -ne 0 ]; then
            echo "❌ Failed to fetch metrics!"
            echo "Response: $METRICS_RESPONSE"
            docker logs malachi-test
            docker stop malachi-test
            exit 1
          fi

          echo "✅ Dashboard is responding correctly"

          # The image's own HEALTHCHECK must turn the container healthy (#282): every compose file used to
          # override the probe, so a broken one in the image went unseen. The container above runs with no
          # health flags, and the check refuses one that overrides the probe. Last, so its wait for the first
          # probe overlaps the checks above instead of adding to them.
          echo "🩺 Checking the image HEALTHCHECK..."
          if ! scripts/docker-image-health-check.sh malachi-test; then
            echo "📋 Container logs:"
            docker logs malachi-test
            exit 1
          fi

          # The image's own defaults, which the compose files and the Kubernetes manifest rely on rather
          # than repeat: the console port is exposed, and a node that booted healthy logged no error.
          # Without MALACHI_AUDIT_LOG_OUTPUT=stdout in the image the release falls back to a file under
          # /var/log/malachi, which its non-root user cannot create, and that boot logs an [error].
          echo "🔎 Checking the image defaults..."
          if ! docker image inspect malachi:test -f '{{json .Config.ExposedPorts}}' | grep -qF '"4042/tcp"'; then
            echo "❌ The image does not expose the console port 4042:"
            docker image inspect malachi:test -f '{{json .Config.ExposedPorts}}'
            exit 1
          fi
          if docker logs malachi-test 2>&1 | grep -F '[error]'; then
            echo "❌ The container logged the errors above while booting healthy"
            exit 1
          fi

          # Stop container
          echo "🛑 Stopping container..."
          docker stop malachi-test
          echo "✅ All tests passed!"

      # A single node keeps what it acknowledged across a restart and a recreate, and refuses to start
      # rather than delete segments its control plane does not know (#273). Its own container and data
      # directory, so it shares nothing with the smoke test above.
      - name: 🔁 Single-node restart drill
        run: SRV_CPUSET=0,1 scripts/docker-single-node-restart.sh malachi:test

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: 🔧 Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'
      
      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-
      
      - name: 🔨 Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch (transient, and worse on a
          # cache miss when every dep downloads at once). Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      
      - name: 📏 Check code complexity
        run: |
          mix archive.install hex ex_check --force
          mix check
        continue-on-error: true
      
      - name: 📝 Generate documentation
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev
      
      - name: 🔍 Check for TODO/FIXME comments
        run: |
          echo "📝 Checking for TODO/FIXME comments..."
          grep -r "TODO\|FIXME" lib/ || echo "✅ No TODO/FIXME found"
        continue-on-error: true

  # The tests tagged :multinode start peer BEAM nodes, which is why `mix test` excludes them by default. They
  # are the only proof of the cross-node paths (replication, failover, sealing on another node's failure),
  # so they run here, in a job of their own: a flaky peer boot must not hide behind the unit suite's result,
  # nor the other way round.
  multinode:
    name: Multinode Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔧 Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      - name: 📦 Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-multinode-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-multinode-

      - name: 🔨 Install dependencies
        run: |
          # Retry: the Hex registry occasionally drops the connection mid-fetch. Fail only if all attempts fail.
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: 🌐 Run multinode tests
        run: mix test --only multinode

  # Specs are part of the contract (a storage failure is `{:error, reason}`, not a raise, and dialyzer is what
  # checks callers still match what a function can return), so they are checked on every pull request rather than
  # left to whoever remembers to run it locally.
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    # The test environment, not dev, because `elixirc_paths(:test)` adds `test/support` and that is the
    # only way its modules are ever type checked: a broken call there used to show up in an editor and
    # nowhere else. Nothing in `lib` compiles differently between the two (no `Mix.env/0` and no
    # `Application.compile_env/2` in it), so this analyses everything the dev run did, and more.
    env:
      MIX_ENV: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔧 Setup Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.1'

      # The PLTs take minutes to build and change only with the toolchain and the dependencies, so they are
      # cached on exactly those. dialyxir keeps the core PLTs under the mix home and the project PLT in _build.
      - name: 📦 Cache dependencies and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.mix
          # `dialyzer-test` rather than `dialyzer`: the key changes only with the toolchain and the lock
          # file, and a cache entry is never overwritten once saved, so reusing the old prefix would keep
          # restoring the dev-only entry and never save the test PLT, rebuilding it on every run.
          key: ${{ runner.os }}-dialyzer-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: 🔨 Install dependencies
        run: |
          for i in 1 2 3; do
            mix deps.get && exit 0
            echo "mix deps.get failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: 🧪 Run dialyzer
        run: mix dialyzer --format github

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, docker, quality, multinode, dialyzer]
    if: always()

    steps:
      - name: 📊 Check results
        run: |
          echo "Test Status: ${{ needs.test.result }}"
          echo "Docker Status: ${{ needs.docker.result }}"
          echo "Quality Status: ${{ needs.quality.result }}"
          echo "Multinode Status: ${{ needs.multinode.result }}"
          echo "Dialyzer Status: ${{ needs.dialyzer.result }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed!"
            exit 1
          fi

          if [ "${{ needs.multinode.result }}" != "success" ]; then
            echo "❌ Multinode tests failed!"
            exit 1
          fi

          if [ "${{ needs.dialyzer.result }}" != "success" ]; then
            echo "❌ Dialyzer failed!"
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "❌ Docker build failed!"
            exit 1
          fi
          
          echo "✅ All critical checks passed!"
