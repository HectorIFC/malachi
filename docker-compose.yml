version: '3.8'

services:
  malachi:
    image: ${DOCKERHUB_USERNAME:-hectorcardoso}/malachi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malachi
    ports:
      - "4040:4040"
      - "4041:4041"
    environment:
      - MALACHIMQ_TCP_PORT=4040
      - MALACHIMQ_DASHBOARD_PORT=4041
      - MALACHI_LOCALE=en_US
      - MALACHIMQ_ADMIN_PASS=${MALACHIMQ_ADMIN_PASS:-admin123}
      - MALACHIMQ_PRODUCER_PASS=${MALACHIMQ_PRODUCER_PASS:-producer123}
      - MALACHIMQ_CONSUMER_PASS=${MALACHIMQ_CONSUMER_PASS:-consumer123}
      - MALACHIMQ_APP_PASS=${MALACHIMQ_APP_PASS:-app123}
      - MALACHIMQ_RATE_LIMIT_ENABLED=true
      - MALACHIMQ_SESSION_IP_BINDING=true
      - MALACHIMQ_AUDIT_LOG_OUTPUT=stdout
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/log/malachi:rw,noexec,nosuid
    mem_limit: 512m
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4040"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  producer:
    image: node:20-alpine
    container_name: malachi-producer
    working_dir: /app
    volumes:
      - ./scripts:/app
    environment:
      - MALACHIMQ_HOST=malachi
      - MALACHIMQ_PORT=4040
      - MALACHIMQ_USER=producer
      - MALACHIMQ_PASS=${MALACHIMQ_PRODUCER_PASS:-producer123}
      - MALACHIMQ_QUEUE=test
      - MALACHI_LOCALE=en_US
    depends_on:
      malachi:
        condition: service_healthy
    command: ["node", "producer.js", "10"]
    profiles:
      - tools
