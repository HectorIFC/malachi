<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 64" width="224" height="64" role="img" aria-label="Malachi">
  <defs>
    <clipPath id="malachi-tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <style>
      .malachi-wordmark { fill: #0a0e27; }
      @media (prefers-color-scheme: dark) {
        .malachi-wordmark { fill: #e8eef7; }
      }
    </style>
  </defs>
  <!-- icon -->
  <g clip-path="url(#malachi-tile)">
    <rect width="64" height="64" fill="#0a0e27"/>
    <path d="M17 46 V18 L32 38 L47 18 V46"
          fill="none" stroke="#00d9ff" stroke-width="8"
          stroke-linejoin="miter" stroke-linecap="butt"/>
    <g fill="#0a0e27">
      <rect x="10" y="21.4" width="44" height="2.6"/>
      <rect x="10" y="27.9" width="44" height="2.6"/>
      <rect x="10" y="34.4" width="44" height="2.6"/>
      <rect x="10" y="40.9" width="44" height="2.6"/>
    </g>
  </g>
  <!-- wordmark -->
  <text class="malachi-wordmark" x="80" y="33"
        font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"
        font-size="34" font-weight="600" letter-spacing="0.5"
        dominant-baseline="central">malachi</text>
</svg>
