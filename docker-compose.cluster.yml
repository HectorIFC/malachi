# Cluster benchmark compose: three Malachi nodes forming ONE metadata vnode (a single ra group spanning
# the three), plus the Elixir load generator driving all three at once (multi-host round-robin). Used by
# benchmark/docker-cluster.sh to answer whether the 3-node cluster crosses 1M rec/s aggregate.
#
# Topology per the measurement design:
# - The three malachi services share the SAME cpuset (SRV_CPUSET, default 4-7): they compete for those
#   cores like three brokers on one box. The loadtest is pinned to DISJOINT cores (LT_CPUSET, default
#   0-3) so the client can never steal server CPU.
# - Erlang distribution: each node runs `--sname malachi` with the container hostname (malachi1..3), so
#   the node names are malachi@malachi1..3; MALACHI_CLUSTER_STRATEGY=epmd connects them and
#   MALACHI_LOG_CLUSTER + MALACHI_LOG_NODES form the replicated control plane (1 vnode:
#   MALACHI_LOG_VNODES=1).
# - Filesystem is isolated per node (each container has its own tmpfs), as a real cluster would be.
# - RF sweeps via `RF`: 1 = segments striped across the three primaries with group commit ACTIVE per
#   node (the throughput regime); 3 = quorum fsync on every batch (group commit is gated off at rf > 1),
#   the full-durability regime.
#
# The Docker VM must have >= 8 CPUs for the default 4-7 / 0-3 split; adjust the cpusets otherwise.

x-malachi-node: &malachi-node
  build:
    context: .
    dockerfile: benchmark/Dockerfile.loadtest
  entrypoint: ["elixir", "--sname", "malachi", "--cookie", "malachi_bench", "-S", "mix", "run", "--no-halt"]
  cpuset: "${SRV_CPUSET:-4,5,6,7}"
  # Cluster-formation race: the first node to reach BrokerServer.init tries to form the shared ra group
  # while its peers' BEAMs are still booting, times out (no quorum), and exits. Restarting on failure is
  # the standard fix (crash-loop until the peer set is reachable); after one or two restarts all three
  # form the group and go healthy.
  restart: on-failure
  environment: &malachi-env
    # Opportunistic schedulers, measured better than a hard 2-per-node cap: with +S 2:2 a node whose
    # placement got more primaries saturated its 2 schedulers while its peers idled (208/133/86
    # percent CPU); +S 4:4 lets the hot node borrow shared cores and evened all three out for +15
    # percent aggregate. Mild oversubscription (12 schedulers on the shared cpuset) is fine, the BEAM
    # yields between them.
    ERL_FLAGS: "${SRV_ERL_FLAGS:-+S 4:4}"
    MALACHI_TCP_PORT: "4040"
    MALACHI_DASHBOARD_PORT: "4041"
    # Parameterized (default epmd) so the config-deploy chaos drill can push a config that fails
    # fast at boot (runtime.exs raises on an unknown strategy) to a single node and roll it back.
    MALACHI_CLUSTER_STRATEGY: "${MALACHI_CLUSTER_STRATEGY:-epmd}"
    MALACHI_LOG_CLUSTER: "malachi_log"
    MALACHI_LOG_NODES: "malachi@malachi1,malachi@malachi2,malachi@malachi3"
    MALACHI_LOG_VNODES: "1"
    MALACHI_LOG_REPLICATION_FACTOR: "${RF:-1}"
    MALACHI_GROUP_COMMIT: "true"
    # Parameterized (default 2, the benchmark tuning) so the config-deploy chaos drill has a
    # harmless setting to roll across the nodes while verifying availability between steps.
    MALACHI_GROUP_COMMIT_INTERVAL_MS: "${MALACHI_GROUP_COMMIT_INTERVAL_MS:-2}"
    # Admission limits off so the sweep is not capped (they gate connections/auth, not the produce path).
    MALACHI_RATE_LIMIT_ENABLED: "false"
    MALACHI_CONNECTION_LIMIT_ENABLED: "false"
    # Data root: /tmp (tmpfs, RAM) by default so fsync cost is uniform for BENCHMARKS. The chaos
    # certification overrides MALACHI_DATA_ROOT=/data (a per-node named volume) because tmpfs is
    # remounted EMPTY on container restart, and durability-through-restart is exactly what it tests.
    MALACHI_LOG_DATA_DIR: "${MALACHI_DATA_ROOT:-/tmp}/malachi_log"
    MALACHI_RA_DATA_DIR: "${MALACHI_DATA_ROOT:-/tmp}/malachi_ra"
    # Active-segment roll size; unset keeps the 64MB library default. The storage-chaos harness sets
    # a small value so segments seal (and become repairable sealed copies) within its window.
    MALACHI_SEGMENT_MAX_BYTES: "${MALACHI_SEGMENT_MAX_BYTES:-}"
    # Internal roll of each segment's own log, which is what writes the sparse-index sidecar. Unset
    # keeps the library defaults (1GB / 1h), so a benchmark never rolls; the storage-chaos drill sets
    # them tiny, because otherwise no `.idx` exists in a test window and its integrity is untestable.
    MALACHI_LOG_ROLL_MAX_BYTES: "${MALACHI_LOG_ROLL_MAX_BYTES:-}"
    MALACHI_LOG_ROLL_MAX_AGE_MS: "${MALACHI_LOG_ROLL_MAX_AGE_MS:-}"
    # Integrity scrub. Unset keeps the production defaults (enabled, one segment a minute); the
    # storage-chaos drill turns the cadence way up so a repair happens inside a test window, and
    # benchmark/docker-scrub.sh sweeps these to measure what the scrub costs under load.
    MALACHI_SCRUB_ENABLED: "${MALACHI_SCRUB_ENABLED:-true}"
    MALACHI_SCRUB_INTERVAL_MS: "${MALACHI_SCRUB_INTERVAL_MS:-}"
    MALACHI_SCRUB_SEGMENTS_PER_TICK: "${MALACHI_SCRUB_SEGMENTS_PER_TICK:-}"
  tmpfs:
    - /tmp:rw,size=1g
  mem_limit: 2g
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4041/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 40s

services:
  malachi1:
    <<: *malachi-node
    container_name: malachi-cluster-1
    hostname: malachi1
    volumes:
      - malachi-chaos-1:/data

  malachi2:
    <<: *malachi-node
    container_name: malachi-cluster-2
    hostname: malachi2
    volumes:
      - malachi-chaos-2:/data

  malachi3:
    <<: *malachi-node
    container_name: malachi-cluster-3
    hostname: malachi3
    volumes:
      - malachi-chaos-3:/data

  loadtest:
    build:
      context: .
      dockerfile: benchmark/Dockerfile.loadtest
    cpuset: "${LT_CPUSET:-0,1,2,3}"
    environment:
      ERL_FLAGS: "+S 4:4"
    mem_limit: 1g
    depends_on:
      malachi1:
        condition: service_healthy
      malachi2:
        condition: service_healthy
      malachi3:
        condition: service_healthy
    # Overridden per run by `docker compose run --rm loadtest <flags>`; default for a plain `up`.
    command: ["--host", "malachi1,malachi2,malachi3", "--scenario", "produce", "--connections", "192", "--batch", "100", "--topics", "64", "--duration", "4", "--warmup", "1", "--json"]

# Per-node persistent data volumes, used only when MALACHI_DATA_ROOT=/data (chaos certification);
# benchmarks keep the tmpfs default and never touch these.
volumes:
  malachi-chaos-1:
  malachi-chaos-2:
  malachi-chaos-3:
